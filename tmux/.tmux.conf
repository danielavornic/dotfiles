unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

set -g default-terminal "tmux-256color"

set -g prefix C-s
set -g prefix2 C-b
bind C-s send-prefix
bind C-b send-prefix
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -gq allow-passthrough on
set -g visual-activity off
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g terminal-features "*:kitty"

set -g focus-events on

set -s escape-time 0

bind-key h select-pane -L
bind-key j select-pane -D 
bind-key k select-pane -U 
bind-key l select-pane -R

bind q killp

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
set -s copy-command 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
set-environment -g VISUAL /opt/homebrew/bin/nvim
set-environment -g EDITOR /opt/homebrew/bin/nvim

# set -g @plugin 'tmux-plugins/tpm'

# set -g @plugin 'TanglingTreats/tmux-everforest' 
# set -g @tmux-everforest 'dark-medium'

                                              
# set -g @tokyo-night-tmux_terminal_icon 

set -g @plugin 'Nybkox/tmux-ukiyo'
set -g @ukiyo-theme "rose-pine/main"
set -g @ukiyo-ignore-window-colors true
set -g @ukiyo-show-empty-plugins false

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'


# (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

